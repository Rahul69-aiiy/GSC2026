# Render service manifest — fill placeholders before applying
# See: https://render.com/docs/deploy-configuration

services:
  - type: web
    name: sportguard-backend
    env: docker
    # repo: set in Render dashboard (or leave commented to use current repo)
    repo: https://github.com/Rahul69-aiiy/GSC2026
    branch: main
    plan: starter
    disk: 10
    dockerfilePath: backend/Dockerfile
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        # Do NOT commit your Atlas URI here — set as a Render Environment Variable or Secret
        # value: ""
      - key: GEMINI_API_KEY
      - key: SECRET_KEY
      - key: TELEGRAM_API_ID
      - key: TELEGRAM_API_HASH
